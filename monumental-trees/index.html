<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Monumental trees – DendrOSM</title>
<link rel="icon" href="../favicon.svg" type="image/svg+xml">
</head>
<body>
<script>
// Mappa mondiale degli alberi monumentali: carica la pagina del tool (../index.html) in modalità "monumental"
// (window.DENDROSM_MODE, vedi MODE in index.html), così il codice è uno solo. L'indirizzo resta questo.
fetch("../index.html").then(r => r.text()).then(html => {
  html = html.replace(/href="favicon\./g, 'href="../favicon.')
    .replace("<head>", '<head><script>window.DENDROSM_MODE = "monumental";<\/script>');
  document.open(); document.write(html); document.close();
});
</script>
</body>
</html>
