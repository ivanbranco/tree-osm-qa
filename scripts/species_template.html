<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- scheda della specie (issue #79), generata da scripts/build_species.py -->
<title>{{TITLE}}</title>
<meta name="description" content="{{DESC}}">
<link rel="icon" href="../favicon.svg" type="image/svg+xml">
<link rel="icon" href="../favicon.png" type="image/png" sizes="64x64">
<link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet">
<!-- Generata da scripts/build_species.py con scripts/species_template.html: le modifiche vanno fatte lì -->
<style>
  :root{--green:#1b6b2c;--ink:#1d2a20;--muted:#5d6b61;--line:#dfe5e0;--bg:#f6f8f6;--card:#fff;--gold:#e6a800;--warn:#b26a00}
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,sans-serif}
  a{color:#1a5fb4}
  header.top{display:flex;align-items:center;gap:12px;padding:10px 16px;background:#fff;border-bottom:1px solid var(--line)}
  header.top .brand{font-weight:700;color:var(--green);text-decoration:none;display:flex;align-items:center;gap:6px}
  header.top .sp{flex:1}
  #lang{border:1px solid var(--line);background:#fff;border-radius:4px;padding:3px 8px;cursor:pointer;font:inherit;font-size:13px}
  main{max-width:1080px;margin:0 auto;padding:20px 16px 40px}
  .hero{display:flex;gap:20px;align-items:flex-start}
  .hero .txt{flex:1;min-width:0}
  .photo{flex:none;width:260px;margin:0;background:#fff;border:1px solid var(--line);border-radius:8px;overflow:hidden}
  .photo img{display:block;width:100%;height:200px;object-fit:cover;background:#e8ece8}
  .photo figcaption{font-size:11.5px;color:var(--muted);padding:4px 8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .photo figcaption a{color:inherit}
  .hero h1{margin:0;font-size:32px;font-style:italic;font-weight:650;letter-spacing:-.01em}
  .hero .common{font-size:19px;color:var(--muted);margin-top:2px}
  .tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
  .tag{font-size:12.5px;padding:2px 9px;border-radius:10px;background:#e8f0e9;color:var(--green)}
  .tag a{color:inherit}
  section{margin-top:28px}
  h2{font-size:20px;margin:0 0 4px}
  .lead{color:var(--muted);margin:0 0 12px;font-size:14px}
  .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin-top:20px}
  .kpi{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:12px 14px}
  .kpi b{display:block;font-size:24px;font-variant-numeric:tabular-nums}
  .kpi span{font-size:13px;color:var(--muted)}
  .grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:12px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:12px 14px}
  .rec h3{margin:0;font-size:13px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);font-weight:600}
  .rec .val{font-size:26px;font-weight:650;font-variant-numeric:tabular-nums;margin-top:2px}
  .rec .val small{font-size:14px;font-weight:400;color:var(--muted)}
  .rec .who{font-size:14px}
  .rec .wiki{font-size:12.5px;color:var(--muted);margin-top:4px}
  .warn{color:var(--warn);cursor:help;font-size:.85em;font-weight:400}
  .rec .val .warn{font-size:14px;vertical-align:6px;margin-left:1px}   /* accanto al valore in grande: piccolo e in alto */
  .rec details{margin-top:6px;font-size:13px}
  .rec summary{cursor:pointer;color:var(--muted)}
  .rec ol{margin:4px 0 0;padding-left:22px}
  .rec ol li{margin:1px 0}
  .none{color:var(--muted);font-style:italic}
  .stat .big{font-size:24px;font-weight:650;font-variant-numeric:tabular-nums}
  .stat .n{font-size:12.5px;color:var(--muted)}
  .stat svg{display:block;width:100%;height:auto;margin-top:8px}
  .ratios{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:12px;margin-top:12px}
  .ratios .card{position:relative}
  .ratios h3{padding-right:28px}
  /* (?) in alto a destra con la spiegazione del grafico: al passaggio del mouse o toccandolo */
  .tip{position:absolute;top:10px;right:10px;width:22px;height:22px;border-radius:50%;border:1px solid var(--line);background:#fff;
    color:var(--muted);font:600 13px/20px system-ui,sans-serif;text-align:center;cursor:help;outline:none}
  .tip:hover,.tip:focus{color:#1a5fb4;border-color:#1a5fb4}
  .tipbox{display:none;position:absolute;top:28px;right:0;z-index:5;width:min(300px,80vw);padding:8px 10px;border-radius:6px;
    background:#fff;border:1px solid var(--line);box-shadow:0 4px 16px #0002;color:var(--ink);font:400 13px/1.45 system-ui,sans-serif;text-align:left;cursor:auto}
  .tip:hover .tipbox,.tip:focus .tipbox{display:block}
  #map{height:480px;border-radius:8px;border:1px solid var(--line);overflow:hidden}
  .controls{display:flex;flex-wrap:wrap;gap:8px 18px;align-items:center;margin:0 0 10px;font-size:14px}
  .seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden;background:#fff}
  .seg button{border:0;background:none;padding:5px 10px;font:inherit;font-size:13px;cursor:pointer;color:var(--ink)}
  .seg button+button{border-left:1px solid var(--line)}
  .seg button[aria-pressed="true"]{background:var(--green);color:#fff}
  .controls label{display:inline-flex;gap:5px;align-items:center;cursor:pointer}
  .legend{display:flex;flex-wrap:wrap;gap:4px 12px;align-items:center;font-size:12.5px;color:var(--muted);margin-top:8px}
  .legend i{display:inline-block;width:14px;height:14px;border-radius:3px;vertical-align:-3px;margin-right:4px;border:1px solid #0002}
  table{border-collapse:collapse;width:100%;font-size:14px;background:#fff;border:1px solid var(--line);border-radius:8px;overflow:hidden}
  th,td{padding:6px 10px;text-align:left;border-bottom:1px solid var(--line)}
  th{font-size:12.5px;color:var(--muted);font-weight:600;background:#fafbfa}
  td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
  .tables{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:12px;margin-top:14px}
  .tables h3{font-size:14px;margin:0 0 6px}
  .looks{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
  .look{background:#fff;border:1px solid var(--line);border-radius:8px;padding:10px;text-align:center}
  .look svg{width:100%;max-width:200px;height:auto;background:#eef1ea;border-radius:6px}
  .look h3{margin:6px 0 0;font-size:15px}
  .look p{margin:2px 0 0;font-size:13px;color:var(--muted)}
  footer{max-width:1080px;margin:0 auto;padding:0 16px 30px;font-size:13px;color:var(--muted)}
  .maplibregl-popup-content{font:13px/1.4 system-ui,sans-serif}
  .look{position:relative}
  .kind{display:inline-block;font-size:11.5px;padding:1px 7px;border-radius:9px;margin-top:4px}
  .kind.gen{background:#eef0ee;color:var(--muted)}
  .kind.own{background:#e8f0e9;color:var(--green)}
  /* (?) accanto al badge «Disegno generico» */
  .help{width:18px;height:18px;margin-left:5px;padding:0;vertical-align:middle;border-radius:50%;border:1px solid var(--line);
    background:#fff;color:var(--muted);font:600 11px/1 system-ui,sans-serif;cursor:pointer}
  .help:hover{color:#1a5fb4;border-color:#1a5fb4}
  dialog{max-width:440px;border:0;border-radius:10px;padding:18px 20px;box-shadow:0 6px 30px #0004;font-size:14.5px}
  dialog::backdrop{background:#0004}
  dialog h3{margin:0 0 8px;font-size:17px}
  dialog .btns{display:flex;gap:8px;justify-content:flex-end;margin-top:14px}
  dialog .btns a,dialog .btns button{font:inherit;font-size:14px;padding:6px 12px;border-radius:6px;cursor:pointer;text-decoration:none}
  dialog .btns a{background:var(--green);color:#fff}
  dialog .btns button{border:1px solid var(--line);background:#fff}
  @media (max-width:700px){.hero{flex-direction:column-reverse}.photo{width:100%}.photo img{height:220px}}
  @media (max-width:600px){.hero h1{font-size:26px} #map{height:380px}}
</style>
</head>
<body>
<header class="top">
  <a class="brand" href="../index.html"><img src="../favicon.svg" width="22" height="22" alt="">DendrOSM</a>
  <span class="sp"></span>
  <button id="lang" type="button"></button>
</header>
<main id="main"></main>
<footer id="foot"></footer>
<script type="application/json" id="data">{{DATA}}</script>
<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script>
"use strict";
const D = JSON.parse(document.getElementById("data").textContent);
const hp = new URLSearchParams(location.hash.slice(1));
const storedLang = () => { try { return localStorage.getItem("lang"); } catch (e) { return null; } };
// stessa scelta della mappa: #lang=, poi la lingua salvata, poi quella del browser
let LANG = [hp.get("lang"), storedLang(), (navigator.language || "").slice(0, 2).toLowerCase() === "it" ? "it" : "en"]
  .find(l => l === "it" || l === "en");

const I18N = {
  it: {
    other: "English",
    trees: "alberi mappati nelle regioni di DendrOSM", regions: (n, t) => `regioni in cui è presente, su ${t}`,
    mon: "monumentali su OSM nel mondo", masaf: "nell'elenco dei monumentali d'Italia (MASAF)",
    issues: "alberi con almeno una segnalazione",
    lt: { broadleaved: "latifoglia", needleleaved: "aghifoglia", palm: "palma" },
    lc: { deciduous: "caducifoglia", semi_deciduous: "semi-caducifoglia", evergreen: "sempreverde", semi_evergreen: "semi-sempreverde" },
    fruitTag: "frutti sulla mappa", wikidata: "Wikidata", wikiRec: "Wiki: Tree species records",
    recTitle: "Alberi da record", recLead: "Gli alberi di questa specie con le misure più grandi, tra tutte le regioni del sito e la mappa dei monumentali. ⚠ = valore segnalato da un check: potrebbe essere sbagliato.",
    nWarn: n => `${n} segnalat${n === 1 ? "o" : "i"} ⚠`,
    rc: { height: "Più alto", trunk: "Tronco più spesso", slender: "Più slanciato", stocky: "Più tozzo", crown: "Chioma più larga", oldest: "Più vecchio" },
    unit: { height: "m", trunk: "m di circonferenza", slender: "altezza/diametro", stocky: "altezza/diametro", crown: "m di diametro", oldest: "" },
    others: n => `i primi ${n}`, noRec: "Nessun albero con questa misura.", warned: "Valore segnalato da un check",
    wikiVal: v => `Record sulla wiki: ${v}`, monMap: "mappa dei monumentali", node: id => `nodo ${id}`,
    sizeTitle: "Misure tipiche", sizeLead: "Mediane degli alberi mappati, senza i valori segnalati dai check. Il grafico mostra quanti alberi ci sono per ogni misura (fino al 99° percentile).",
    height: "Altezza", trunkM: "Circonferenza del tronco", crownM: "Diametro della chioma", median: "mediana",
    on: n => `su ${n} alberi`, few: "Troppo pochi alberi con questa misura.",
    hc: "Altezza / circonferenza", crc: "Chioma / circonferenza",
    hcInfo: "Quanti metri di altezza per ogni metro di circonferenza: più è alto, più l'albero è slanciato.",
    crcInfo: "Quanti metri di chioma per ogni metro di circonferenza.",
    scHelp: "Come leggere il grafico", axC: "Circonferenza del tronco (m)", axH: "Altezza (m)", axCr: "Diametro della chioma (m)",
    scInfo: "Ogni punto è un gruppo di alberi con misure vicine: più è scuro, più alberi ci sono. La linea tratteggiata è la mediana: sopra il rapporto è più alto, sotto più basso.",
    scOver: n => `${n} alberi oltre il 99° percentile non sono nel grafico.`,
    wikiAvg: v => `sulla wiki: ${v}`,
    mapTitle: "Dove è mappata", mapLead: "La specie nelle regioni di DendrOSM. Le regioni grigie sono coperte dal sito ma senza alberi di questa specie; fuori dalle regioni colorate il sito non ha dati, tranne i monumentali.",
    mShare: "Quota", mCount: "Numero", mDens: "Per km²", gReg: "Regioni", gNat: "Nazioni",
    heat: "Densità degli alberi", monL: "Monumentali",
    shareInfo: "alberi di questa specie su 100 alberi con la specie mappata", countInfo: "alberi di questa specie", densInfo: "alberi di questa specie per km²",
    absent: "nessuno", topShare: "Regioni con la quota più alta", topCount: "Regioni con più alberi",
    region: "Regione", treesCol: "Alberi", shareCol: "Quota", densCol: "Per km²",
    lookTitle: "Sulla mappa", lookLead: "Come DendrOSM disegna questa specie nel corso dell'anno (emisfero nord; a sud dell'equatore i mesi si spostano di 6).",
    leaves: "Con le foglie", autumn: "Autunno", bare: "Spoglio", fruits: "Con i frutti", always: "Tutto l'anno",
    months: ["gen", "feb", "mar", "apr", "mag", "giu", "lug", "ago", "set", "ott", "nov", "dic"],
    see: "Vedi sulla mappa", evergreen: "Sempreverde: lo stesso aspetto tutto l'anno.",
    autumnInfo: "Ogni albero prende uno dei quattro toni autunnali.",
    own: "Disegno della specie", generic: "Disegno generico",
    genTitle: "Disegno generico",
    genText: (lt, lc) => {
      const a = { broadleaved: "le latifoglie", needleleaved: "le aghifoglie", palm: "le palme" }[lt];
      const b = { deciduous: "caducifoglie", semi_deciduous: "semi-caducifoglie", evergreen: "sempreverdi", semi_evergreen: "semi-sempreverdi" }[lc];
      return `Questo disegno non è proprio di questa specie: è lo stesso per tutte ${a ? a + (b ? " " + b : "") : "gli alberi senza un tipo di foglia"}.`;
    },
    genAsk: "Se la specie ha qualcosa di riconoscibile (il colore delle foglie in una stagione, i frutti, i fiori, la corteccia), puoi proporre un disegno dedicato aprendo una issue su GitHub: serve un account GitHub.",
    propose: "Proponi un disegno", close: "Chiudi",
    foot: d => `Dati OpenStreetMap (ODbL), aggiornati al ${d}. Record e medie sulla wiki: pagina <a href="${WIKI}" target="_blank" rel="noopener">«Tree species records»</a>.`
  },
  en: {
    other: "Italiano",
    trees: "trees mapped in the DendrOSM regions", regions: (n, t) => `regions where it is present, out of ${t}`,
    mon: "monumental trees on OSM worldwide", masaf: "in the list of monumental trees of Italy (MASAF)",
    issues: "trees with at least one warning",
    lt: { broadleaved: "broadleaved", needleleaved: "needleleaved", palm: "palm" },
    lc: { deciduous: "deciduous", semi_deciduous: "semi-deciduous", evergreen: "evergreen", semi_evergreen: "semi-evergreen" },
    fruitTag: "fruits on the map", wikidata: "Wikidata", wikiRec: "Wiki: Tree species records",
    recTitle: "Record trees", recLead: "The trees of this species with the largest measurements, across all the regions of the site and the monumental map. ⚠ = value reported by a check: it may be wrong.",
    nWarn: n => `${n} reported ⚠`,
    rc: { height: "Tallest", trunk: "Thickest trunk", slender: "Most slender", stocky: "Stockiest", crown: "Widest crown", oldest: "Oldest" },
    unit: { height: "m", trunk: "m girth", slender: "height/diameter", stocky: "height/diameter", crown: "m across", oldest: "" },
    others: n => `top ${n}`, noRec: "No tree with this measurement.", warned: "Value reported by a check",
    wikiVal: v => `Record on the wiki: ${v}`, monMap: "monumental map", node: id => `node ${id}`,
    sizeTitle: "Typical sizes", sizeLead: "Medians of the mapped trees, without the values reported by the checks. The chart shows how many trees there are for each value (up to the 99th percentile).",
    height: "Height", trunkM: "Trunk circumference", crownM: "Crown diameter", median: "median",
    on: n => `from ${n} trees`, few: "Too few trees with this measurement.",
    hc: "Height / circumference", crc: "Crown / circumference",
    hcInfo: "Metres of height for each metre of circumference: the higher, the more slender the tree.",
    crcInfo: "Metres of crown for each metre of circumference.",
    scHelp: "How to read the chart", axC: "Trunk circumference (m)", axH: "Height (m)", axCr: "Crown diameter (m)",
    scInfo: "Each dot is a group of trees with close values: the darker, the more trees. The dashed line is the median: above it the ratio is higher, below it lower.",
    scOver: n => `${n} trees above the 99th percentile are not in the chart.`,
    wikiAvg: v => `on the wiki: ${v}`,
    mapTitle: "Where it is mapped", mapLead: "The species in the DendrOSM regions. Grey regions are covered by the site but have no trees of this species; outside the coloured regions the site has no data, except for monumental trees.",
    mShare: "Share", mCount: "Count", mDens: "Per km²", gReg: "Regions", gNat: "Countries",
    heat: "Tree density", monL: "Monumental trees",
    shareInfo: "trees of this species per 100 trees with a mapped species", countInfo: "trees of this species", densInfo: "trees of this species per km²",
    absent: "none", topShare: "Regions with the highest share", topCount: "Regions with the most trees",
    region: "Region", treesCol: "Trees", shareCol: "Share", densCol: "Per km²",
    lookTitle: "On the map", lookLead: "How DendrOSM draws this species through the year (northern hemisphere; south of the equator the months shift by 6).",
    leaves: "In leaf", autumn: "Autumn", bare: "Bare", fruits: "With fruits", always: "All year",
    months: ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"],
    see: "See on the map", evergreen: "Evergreen: the same look all year.",
    autumnInfo: "Each tree takes one of the four autumn tones.",
    own: "Species drawing", generic: "Generic drawing",
    genTitle: "Generic drawing",
    genText: (lt, lc) => `This drawing is not specific to this species: it is the same for all ${[{ deciduous: "deciduous", semi_deciduous: "semi-deciduous", evergreen: "evergreen", semi_evergreen: "semi-evergreen" }[lc],
      { broadleaved: "broadleaved", needleleaved: "needleleaved", palm: "palm" }[lt]].filter(Boolean).join(" ")} trees.`,
    genAsk: "If the species has something recognisable (the colour of its leaves in a season, its fruits, flowers or bark), you can suggest a dedicated drawing by opening an issue on GitHub: a GitHub account is needed.",
    propose: "Suggest a drawing", close: "Close",
    foot: d => `OpenStreetMap data (ODbL), updated on ${d}. Records and averages on the wiki: page <a href="${WIKI}" target="_blank" rel="noopener">"Tree species records"</a>.`
  }
};
let T, LOC;
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
const fmt = (v, d = 0) => v == null ? "–" : Number(v).toLocaleString(LOC, { maximumFractionDigits: d, minimumFractionDigits: 0 });
// densità e quote piccole: due cifre significative (0,0034), non zero
const sig = v => v == null ? "–" : v >= 10 ? fmt(v) : v === 0 ? "0" : Number(v).toLocaleString(LOC, { maximumSignificantDigits: 2 });
const regName =slug => slug && D.regions[slug] ? (LANG === "it" ? D.regions[slug].name : D.regions[slug].name_en) : null;
const treeLink = t => t.r ? `../index.html#region=${t.r}&node=${t.id}` : `../monumental-trees/index.html#node=${t.id}`;
const WIKI = "https://wiki.openstreetmap.org/wiki/Tag:natural%3Dtree/Tree_species_records";

// ---------- intestazione e numeri ----------
function hero() {
  const n = D.names, common = LANG === "it" ? n.it || n.en : n.en || n.it;
  const tags = [];
  if (D.lt && T.lt[D.lt]) tags.push(T.lt[D.lt]);
  if (D.lc && T.lc[D.lc]) tags.push(T.lc[D.lc]);
  if (D.fruit) tags.push(`<span style="display:inline-block;width:9px;height:9px;border-radius:50%;background:${esc(D.fruit.color)};vertical-align:0"></span> ${T.fruitTag}`);
  const wp = D.wp || {}, wpl = wp[LANG] || wp.en || wp.it;
  if (wpl) tags.push(`<a href="${esc(wpl.url)}" target="_blank" rel="noopener">Wikipedia</a>`);
  if (D.qid) tags.push(`<a href="https://www.wikidata.org/wiki/${esc(D.qid)}" target="_blank" rel="noopener">${T.wikidata}</a>`);
  const nReg = Object.keys(D.regions).length;
  const kpi = (v, l) => `<div class="kpi"><b>${v}</b><span>${l}</span></div>`;
  // foto: quella in testa alla voce di Wikipedia nella lingua della pagina (o nell'altra), poi l'immagine Wikidata
  const img = (wp[LANG] || {}).img || (wp[LANG === "it" ? "en" : "it"] || {}).img || wp.p18;
  const photo = img ? `<figure class="photo"><a href="https://commons.wikimedia.org/wiki/File:${encodeURIComponent(img)}" target="_blank" rel="noopener">
    <img src="https://commons.wikimedia.org/wiki/Special:FilePath/${encodeURIComponent(img)}?width=520" alt="${esc(D.name)}"></a>
    <figcaption data-file="${esc(img)}">Wikimedia Commons</figcaption></figure>` : "";
  return `<div class="hero"><div class="txt"><h1>${esc(D.name)}</h1>${common ? `<div class="common">${esc(common)}</div>` : ""}
    <div class="tags">${tags.map(t => `<span class="tag">${t}</span>`).join("")}</div>
</div>${photo}</div>
    <div class="kpis">${kpi(fmt(D.total), T.trees)}${kpi(fmt(D.n_regions), T.regions(D.n_regions, fmt(nReg)))}
    ${kpi(fmt(D.mon.length), T.mon)}${D.masaf && LANG === "it" ? kpi(fmt(D.masaf), T.masaf) : ""}
    ${kpi(fmt(D.issues), T.issues + ` (${fmt(100 * D.issues / Math.max(1, D.total), 1)}%)`)}</div>`;
}

// autore e licenza della foto da Commons (come creditName e fillPhoto in index.html)
const plain = html => new DOMParser().parseFromString(html || "", "text/html").body.textContent.replace(/\s+/g, " ").trim();
function creditName(md) {
  if (plain(md.Attribution?.value)) return plain(md.Attribution.value);
  const doc = new DOMParser().parseFromString(md.Artist?.value || "", "text/html");
  doc.querySelectorAll('[style*="display:none"], [style*="display: none"]').forEach(e => e.remove());
  const a = [...doc.querySelectorAll("a")].map(x => x.textContent.replace(/\s+/g, " ").trim()).find(Boolean);
  return a || doc.body.textContent.replace(/\s+/g, " ").trim();
}
async function fillCredit() {
  const cap = document.querySelector(".photo figcaption");
  if (!cap) return;
  try {

// ---------- misure tipiche ----------
function histSvg(h, med, unit) {
  const W = 320, H = 110, P = 18, n = h.bins.length, max = Math.max(...h.bins), bw = (W - 8) / n;
  const bars = h.bins.map((c, i) => `<rect x="${4 + i * bw + 0.5}" y="${H - P - (H - P - 6) * c / max}" width="${Math.max(1, bw - 1)}" height="${(H - P - 6) * c / max}" fill="#7fb38a"/>`).join("");
  const step = h.step, ticks = [];
  const every = Math.ceil(n / 6);
  for (let i = 0; i <= n; i += every) ticks.push(`<text x="${4 + i * bw}" y="${H - 4}" font-size="10" fill="#5d6b61" text-anchor="middle">${fmt(i * step, 2)}</text>`);
  const mx = med != null ? 4 + med / step * bw : null;
  return `<svg viewBox="0 0 ${W} ${H}" role="img">${bars}
    <line x1="4" x2="${W - 4}" y1="${H - P}" y2="${H - P}" stroke="#c9d1cb"/>${ticks.join("")}
    ${mx != null ? `<line x1="${mx}" x2="${mx}" y1="4" y2="${H - P}" stroke="#1b6b2c" stroke-width="1.5" stroke-dasharray="3 2"/>` : ""}</svg>`;
}
// passo «tondo» (1, 2, 5 × 10^k) per avere circa n tacche fino a max
const niceStep = (max, n = 5) => { const raw = max / n, p = 10 ** Math.floor(Math.log10(raw)); return [1, 2, 5, 10].map(m => m * p).find(s => s >= raw); };
// nuvola di punti dei rapporti (build_species.py, scatter): circonferenza in x, altezza o chioma in y; ogni punto è
// una cella della griglia, più scuro se ha più alberi. La retta tratteggiata passa per l'origine con pendenza uguale
// alla mediana del rapporto: sopra ci sono gli alberi con il rapporto più alto della mediana, sotto quelli più basso.
function scatterSvg(sc, med, yLabel) {
  const W = 480, H = 300, L = 46, R = 12, Tp = 8, B = 40, pw = W - L - R, ph = H - Tp - B;
  const xmax = sc.nx * sc.sx, ymax = sc.ny * sc.sy, cw = pw / sc.nx, ch = ph / sc.ny;
  const X = v => L + v / xmax * pw, Y = v => Tp + ph - v / ymax * ph;
  let max = 1;
  for (let k = 2; k < sc.pts.length; k += 3) max = Math.max(max, sc.pts[k]);
  const lm = Math.log(1 + max), dots = [];
  for (let k = 0; k < sc.pts.length; k += 3) {
    const [i, j, c] = [sc.pts[k], sc.pts[k + 1], sc.pts[k + 2]];
    const op = (0.2 + 0.8 * Math.log(1 + c) / lm).toFixed(2);
    dots.push(`<circle cx="${(L + (i + 0.5) * cw).toFixed(1)}" cy="${(Tp + ph - (j + 0.5) * ch).toFixed(1)}" r="2" fill-opacity="${op}"/>`);
  }
  const ax = [], gx = niceStep(xmax), gy = niceStep(ymax, 4);
  for (let v = 0; v <= xmax + 1e-9; v += gx) ax.push(`<line x1="${X(v)}" x2="${X(v)}" y1="${Tp}" y2="${Tp + ph}" stroke="#eef1ee"/><text x="${X(v)}" y="${Tp + ph + 16}" text-anchor="middle">${fmt(v, 2)}</text>`);
  for (let v = 0; v <= ymax + 1e-9; v += gy) ax.push(`<line x1="${L}" x2="${L + pw}" y1="${Y(v)}" y2="${Y(v)}" stroke="#eef1ee"/><text x="${L - 5}" y="${Y(v) + 4.5}" text-anchor="end">${fmt(v, 2)}</text>`);
  // retta della mediana fino al bordo del grafico (a destra o in alto)
  const xe = Math.min(xmax, ymax / med), ye = xe * med;
  return `<svg viewBox="0 0 ${W} ${H}" role="img" font-size="13" fill="#5d6b61">${ax.join("")}
    <g fill="#2f7d40">${dots.join("")}</g>
    <line x1="${X(0)}" y1="${Y(0)}" x2="${X(xe)}" y2="${Y(ye)}" stroke="#1b6b2c" stroke-width="1.5" stroke-dasharray="4 3"/>
    <line x1="${L}" x2="${L + pw}" y1="${Tp + ph}" y2="${Tp + ph}" stroke="#c9d1cb"/><line x1="${L}" x2="${L}" y1="${Tp}" y2="${Tp + ph}" stroke="#c9d1cb"/>
    <text x="${L + pw / 2}" y="${H - 3}" text-anchor="middle">${T.axC}</text>
    <text transform="translate(13 ${Tp + ph / 2}) rotate(-90)" text-anchor="middle">${yLabel}</text></svg>`;
}
function sizes() {
  const S = D.stats;
  const box = (title, s, unit) => `<div class="card stat"><h3 style="margin:0;font-size:14px">${title}</h3>${s.med == null
    ? `<div class="none">${T.few}</div>` : `<div><span class="big">${fmt(s.med, 2)} ${unit}</span> <span class="n">${T.median}, ${T.on(fmt(s.n))}</span></div>

  const tip = sc => `<span class="tip" tabindex="0" role="button" aria-label="${esc(T.scHelp)}">?<span class="tipbox" role="tooltip">${T.scInfo}${sc.over ? " " + T.scOver(fmt(sc.over)) : ""}</span></span>`;

function choropleth() {

  const stats = mapGroup === "reg" ? D.regions : D.nations;
  // in «Nazioni» i contorni "g:<nazione>" e le regioni che sono già una nazione; in «Regioni» tutte le altre
  const keys = BOUNDS.features.map(f => f.properties.key).filter(k => mapGroup === "nat" ? k in D.nations : !k.startsWith("g:"));
  const vals = keys.map(k => valueOf(stats[k], mapMode));
  const br = breaks(vals);
  const expr = ["match", ["get", "key"]];
  keys.forEach((k, i) => { const v = vals[i]; if (v == null) return; expr.push(k, v > 0 ? PALETTE[classOf(v, br)] : ABSENT); });

    PALETTE.slice(0, br.length + 1).map((c, i) => `<span><i style="background:${c}"></i>${lab(i)}${mapMode === "share" ? "%" : ""}</span>`).join("") +

const hash01 = (id, k) => { let x = (id * 2654435761 + k * 40503) >>> 0; x ^= x >>> 15; x = Math.imul(x, 2246822507) >>> 0;
  x ^= x >>> 13; return (x >>> 0) / 4294967296; };
// sagoma della chioma vista dall'alto (crownOutline in index.html)
function crownOutline(kind, id, r) {
  const pts = [];
  if (kind === "spiky") {
    const n = 14, kin = 0.74, rot = (id % 11) / 11 * (2 * Math.PI / n);
    const R = r * Math.sqrt(Math.PI / (n * kin * Math.sin(Math.PI / n)));
    for (let k = 0; k < 2 * n; k++) { const a = rot + k * Math.PI / n, Rk = k % 2 ? R * kin : R; pts.push([Rk * Math.cos(a), Rk * Math.sin(a)]); }
  } else if (kind === "palm") {
    const n = 8 + (id % 3), M = 8, rot = hash01(id, 4) * 2 * Math.PI, kin = 0.3, rr = [];
    for (let f = 0; f < n; f++) { const len = 1 + (hash01(id, 20 + f) - 0.5) * 0.16;
      for (let j = 0; j < M; j++) { const d = Math.abs(2 * j / M - 1); rr.push(kin + (len - kin) * Math.pow(1 - d, 0.6)); } }
    const da = 2 * Math.PI / rr.length; let area = 0; rr.forEach((v, k) => area += 0.5 * v * rr[(k + 1) % rr.length] * Math.sin(da));
    const sc = r * Math.sqrt(Math.PI / area); rr.forEach((v, k) => pts.push([sc * v * Math.cos(rot + k * da), sc * v * Math.sin(rot + k * da)]));
  } else {
    const lobes = 6 + (id % 3), ph = (id % 97) * 0.37, N = 56;
    for (let k = 0; k < N; k++) { const a = k / N * 2 * Math.PI, R = r * 1.06 * (0.84 + 0.16 * Math.abs(Math.sin(lobes / 2 * a + ph))); pts.push([R * Math.cos(a), R * Math.sin(a)]); }
  }
  return pts;
}
const CYCLE_COLOR = lc => /^(semi_)?deciduous$/.test(lc) ? "#a5d64c" : /^(semi_)?evergreen$/.test(lc) ? "#1f6b35" : "#5fa36f";
const AUTUMN_TONES = ["#e3b524", "#dd8a1f", "#b5502a", "#9a6b3a"];

  const pts = crownOutline(kind, id, r).map(([x, y]) => `${(cx + x).toFixed(1)},${(cy - y).toFixed(1)}`).join(" ");
  let s = `<polygon points="${pts}" fill="${fill}" fill-opacity="${opacity}" stroke="${stroke}" stroke-width="${sw}"/>`;
  if (trunk) s += `<circle cx="${cx}" cy="${cy}" r="${r * 0.11}" fill="${D.bark || "#7b4a1e"}"${D.bark ? ' stroke="#8a8a8a" stroke-width="0.8"' : ""}/>`;
  if (fruits) {                                   // 7 frutti come su una chioma grande (decoPoints in index.html)

const monthRange = (a, b) => `${T.months[a - 1]} – ${T.months[b - 1]}`;
const monthList = ms => { // mesi consecutivi uniti: [7,8,9] -> lug – set

// tutte le specie con quel tipo di foglia e quel ciclo): sui generici un (?) accanto al badge invita a proporne uno dedicato.
// Lo spoglio è uguale per tutti gli alberi caducifogli e non ha badge
const ISSUE = "https://github.com/ivanbranco/tree-osm-qa/issues/new?template=species-rendering.yml";
function looks() {
  const dec = /^(semi_)?deciduous$/.test(D.lc || ""), broad = D.lt === "broadleaved", sm = D.sample;
  const sc = D.spColor, scAut = sc && sc[2], scLeaf = sc && !sc[2];
  const link = season => sm ? `<p><a href="../index.html#region=${sm.r}&node=${sm.id}${season ? "&season=" + season : ""}">${T.see}</a></p>` : "";
  // own === null: disegno uguale per tutte le specie (spoglio), senza badge né (?)
  const badge = own => own === null ? "" : `<span class="kind ${own ? "own" : "gen"}">${own ? T.own : T.generic}</span>${own ? "" : `<button class="help" type="button" title="${T.genTitle}" aria-label="${T.genTitle}">?</button>`}`;
  const tile = (title, sub, body, season, own) => `<div class="look">
    <svg viewBox="0 0 200 200">${body}</svg><h3>${title}</h3>${badge(own)}<p>${sub}</p>${link(season)}</div>`;
  const base = CYCLE_COLOR(D.lc || "");
  const leafFill = scLeaf ? sc[0] : base;
  const leafSub = scLeaf && sc[1] ? monthList(sc[1]) : dec ? monthRange(4, 9) : T.evergreen;
  const tiles = [tile(T.leaves, leafSub, treeSvg({ fill: leafFill, opacity: scLeaf ? 0.7 : 0.55 }), dec ? "leaves" : "", !!scLeaf)];
  if (scAut) {
    tiles.push(tile(T.autumn, monthList(sc[1]), treeSvg({ fill: sc[0], opacity: 0.7 }), "autumn", true));
  } else if (dec && broad) {
    const four = AUTUMN_TONES.map((c, i) => treeSvg({ fill: c, opacity: 0.7, id: 1234567 + i * 7919 }, 55 + (i % 2) * 90, 55 + Math.floor(i / 2) * 90, 40)).join("");
    tiles.push(tile(T.autumn, `${monthRange(10, 11)}. ${T.autumnInfo}`, four, "autumn", false));
  }
  if (dec) tiles.push(tile(T.bare, monthRange(12, 3), treeSvg({ fill: "#cdbb9f", opacity: 0.02, stroke: "#7d6650", sw: 1.6 }), "bare", null));
  if (D.fruit) tiles.push(tile(T.fruits, monthList(D.fruit.months), treeSvg({ fill: base, fruits: D.fruit.color }), "", true));
  const issue = `${ISSUE}&title=${encodeURIComponent("Rendering: " + D.name)}&species=${encodeURIComponent(D.name)}`;
  return `<section><h2>${T.lookTitle}</h2><p class="lead">${T.lookLead}</p><div class="looks">${tiles.join("")}</div>
    <dialog id="gen-dlg"><h3>${T.genTitle}</h3><p>${T.genText(D.lt, D.lc)}</p><p>${T.genAsk}</p>
      <div class="btns"><button type="button" value="close">${T.close}</button><a href="${issue}" target="_blank" rel="noopener">${T.propose}</a></div></dialog></section>`;
}
function bindLooks() {
  const dlg = document.getElementById("gen-dlg");
  document.querySelectorAll(".look .help").forEach(b => b.addEventListener("click", () => dlg.showModal()));
  dlg.querySelector("button").addEventListener("click", () => dlg.close());
  dlg.addEventListener("click", e => { if (e.target === dlg) dlg.close(); });   // clic fuori dal riquadro
}

// ---------- pagina ----------
function render() {
  T = I18N[LANG]; LOC = LANG === "it" ? "it-IT" : "en-GB";
  document.documentElement.lang = LANG;
  document.getElementById("lang").textContent = T.other;
  const view = map ? { c: map.getCenter(), z: map.getZoom() } : null;
  if (map) { map.remove(); map = null; BOUNDS = null; }
  document.getElementById("main").innerHTML = hero() + looks() + records() + sizes() + mapSection();
  document.getElementById("foot").innerHTML = T.foot(new Date(D.updated).toLocaleDateString(LOC, { day: "numeric", month: "long", year: "numeric" }));
  initMap(); bindMap(); bindLooks(); fillCredit();
  if (view) map.once("load", () => map.jumpTo({ center: view.c, zoom: view.z }));
}
document.getElementById("lang").addEventListener("click", () => {
  LANG = LANG === "it" ? "en" : "it";
  try { localStorage.setItem("lang", LANG); } catch (e) {}
  render();
});
render();
</script>
</body>
</html>
