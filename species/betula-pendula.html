let T, LOC;
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
const fmt = (v, d = 0) => v == null ? "–" : Number(v).toLocaleString(LOC, { maximumFractionDigits: d, minimumFractionDigits: 0 });
// densità e quote piccole: due cifre significative (0,0034), non zero
const sig = v => v == null ? "–" : v >= 10 ? fmt(v) : v === 0 ? "0" : Number(v).toLocaleString(LOC, { maximumSignificantDigits: 2 });
const regName =slug => slug && D.regions[slug] ? (LANG === "it" ? D.regions[slug].name : D.regions[slug].name_en) : null;
const treeLink = t => t.r ? `../index.html#region=${t.r}&node=${t.id}` : `../monumental-trees/index.html#node=${t.id}`;
const WIKI = "https://wiki.openstreetmap.org/wiki/Tag:natural%3Dtree/Tree_species_records";

// ---------- intestazione e numeri ----------
function hero() {
  const n = D.names, common = LANG === "it" ? n.it || n.en : n.en || n.it;
  const tags = [];
  if (D.lt && T.lt[D.lt]) tags.push(T.lt[D.lt]);
  if (D.lc && T.lc[D.lc]) tags.push(T.lc[D.lc]);
  if (D.fruit) tags.push(`<span style="display:inline-block;width:9px;height:9px;border-radius:50%;background:${esc(D.fruit.color)};vertical-align:0"></span> ${T.fruitTag}`);
  const wp = D.wp || {}, wpl = wp[LANG] || wp.en || wp.it;
  if (wpl) tags.push(`<a href="${esc(wpl.url)}" target="_blank" rel="noopener">Wikipedia</a>`);
  if (D.qid) tags.push(`<a href="https://www.wikidata.org/wiki/${esc(D.qid)}" target="_blank" rel="noopener">${T.wikidata}</a>`);
  const nReg = Object.keys(D.regions).length;
  const kpi = (v, l) => `<div class="kpi"><b>${v}</b><span>${l}</span></div>`;
  // foto: quella in testa alla voce di Wikipedia nella lingua della pagina (o nell'altra), poi l'immagine Wikidata
  const img = (wp[LANG] || {}).img || (wp[LANG === "it" ? "en" : "it"] || {}).img || wp.p18;
  const photo = img ? `<figure class="photo"><a href="https://commons.wikimedia.org/wiki/File:${encodeURIComponent(img)}" target="_blank" rel="noopener">
    <img src="https://commons.wikimedia.org/wiki/Special:FilePath/${encodeURIComponent(img)}?width=520" alt="${esc(D.name)}"></a>
    <figcaption data-file="${esc(img)}">Wikimedia Commons</figcaption></figure>` : "";
  // sinonimi di whitelist.json contati come questa specie (build_species.py, synonyms_of): nome e alberi con quel nome
  const syn = (D.synonyms || []).length ? `<div class="syn">${T.syn}: ${D.synonyms.map(([s, k]) =>
    `<i title="${esc(T.synN(fmt(k)))}">${esc(s)}</i> (${fmt(k)})`).join(", ")}</div>` : "";
  return `<div class="hero"><div class="txt"><h1>${esc(D.name)}</h1>${common ? `<div class="common">${esc(common)}</div>` : ""}
    ${syn}<div class="tags">${tags.map(t => `<span class="tag">${t}</span>`).join("")}</div>
</div>${photo}</div>
    <div class="kpis">${kpi(fmt(D.total), T.trees)}${kpi(fmt(D.n_regions), T.regions(D.n_regions, fmt(nReg)))}
    ${kpi(fmt(D.mon_n), T.mon)}${D.masaf && LANG === "it" ? kpi(fmt(D.masaf), T.masaf) : ""}
    ${kpi(fmt(D.issues), T.issues + ` (${fmt(100 * D.issues / Math.max(1, D.total), 1)}%)`)}</div>`;
}

// autore e licenza della foto da Commons (come creditName e fillPhoto in index.html)
const plain = html => new DOMParser().parseFromString(html || "", "text/html").body.textContent.replace(/\s+/g, " ").trim();
function creditName(md) {
  if (plain(md.Attribution?.value)) return plain(md.Attribution.value);
  const doc = new DOMParser().parseFromString(md.Artist?.value || "", "text/html");
  doc.querySelectorAll('[style*="display:none"], [style*="display: none"]').forEach(e => e.remove());
  const a = [...doc.querySelectorAll("a")].map(x => x.textContent.replace(/\s+/g, " ").trim()).find(Boolean);
  return a || doc.body.textContent.replace(/\s+/g, " ").trim();
}
function fillCredit() { document.querySelectorAll(".photo figcaption[data-file]").forEach(fillCap); }
async function fillCap(cap) {
  try {
    const r = await fetch("https://commons.wikimedia.org/w/api.php?format=json&formatversion=2&origin=*&action=query&prop=imageinfo&iiprop=extmetadata&titles="
      + encodeURIComponent("File:" + cap.dataset.file)).then(r => r.json());
    const md = r.query.pages[0].imageinfo?.[0]?.extmetadata || {};
    const author = creditName(md), lic = plain(md.LicenseShortName?.value);
    const txt = [author, lic && (author ? `(${lic})` : lic)].filter(Boolean).join(" ");
    if (txt) { cap.innerHTML = `<a href="https://commons.wikimedia.org/wiki/File:${encodeURIComponent(cap.dataset.file)}" target="_blank" rel="noopener">${esc(txt)}</a>`; cap.title = txt; }
  } catch (e) {}
}

// ---------- primati ----------
// isolated: calcolato con QLever da build_species.py (species_isolated); "cap" = niente entro 50 km («> 50»)

const recVal = (k, t) => k === "oldest" ? esc(t.tags.start_date || t.v) : k === "isolated" && t.cap ? `&gt; ${fmt(t.v)}`
  : fmt(t.v, k === "slender" || k === "stocky" ? 1 : 2);
const isoNear = t => t.cap ? T.isoCap : T.isoNear[t.nk] || "";

}
// «Più vecchio»: t.ev = la voce di scripts/year_events.json per la data dell'albero (build_species.py, year_events).
// evBtn: il pulsante col calendario, dopo l'albero; evText: la frase con la «W» della fonte su Wikipedia, sotto, chiusa

const EV_ICON = '<svg viewBox="0 0 14 14" aria-hidden="true"><rect x="1.5" y="2.5" width="11" height="10" rx="1.5"/><path d="M1.5 5.5h11M4.5 1v3M9.5 1v3"/></svg>';

  const wp = src ? ` <a class="wp" href="https://${ev["wiki_" + LANG] ? LANG : "en"}.wikipedia.org/wiki/${encodeURIComponent(src.replace(/ /g, "_"))}" target="_blank" rel="noopener" title="${esc(T.evSrc)}" aria-label="${esc(T.evSrc)}">W</a>` : "";

  document.querySelectorAll(".rec .ev").forEach(b => b.addEventListener("click", () => {

function records() {
  const wiki = { height: D.wiki.height, trunk: D.wiki.circumference };
  // in grande il primo della classifica, anche se segnalato (con ⚠); nell'elenco richiudibile gli altri, dal secondo
  const cards = REC.map(k => {
    const list = D.records[k] || [], t = list[0];
    if (!t) return `<div class="card rec"><h3>${T.rc[k]}</h3><div class="none">${T.noRec}</div></div>`;
    const nWarn = list.filter(x => x.w).length;
    const iso = k === "isolated";
    const rest = list.slice(1).map((x, i) => `<li value="${i + 2}"><b>${recVal(k, x)}</b> · ${recRow(k, x)}${iso ? ` · ${esc(isoNear(x))}` : ""}${evBtn(x)}${evText(x)}</li>`);
    return `<div class="card rec"><h3>${T.rc[k]}</h3>
      <div class="val">${recVal(k, t)}${t.w ? ` <span class="warn" title="${T.warned}">⚠</span>` : ""} <small>${T.unit[k]}</small></div>
      <div class="who">${recRow(k, t, false)}${evBtn(t)}</div>${evText(t)}
      ${iso ? `<div class="wiki">${esc(isoNear(t))}</div><div class="wiki">${esc(T.isoHow)}</div>` : ""}
      ${wiki[k] ? `<div class="wiki">${T.wikiVal(fmt(wiki[k], 2) + " m")}</div>` : ""}
      ${rest.length ? `<details><summary>${T.others(list.length)}${nWarn ? ` · ${T.nWarn(nWarn)}` : ""}</summary><ol>${rest.join("")}</ol></details>` : ""}</div>`;
  }).join("");
  return `<section><h2>${T.recTitle}</h2><p class="lead">${T.recLead}</p><div class="grid3">${cards}</div></section>`;
}

// ---------- misure tipiche ----------
function histSvg(h, med, unit) {
  const W = 320, H = 110, P = 18, n = h.bins.length, max = Math.max(...h.bins), bw = (W - 8) / n;
  const bars = h.bins.map((c, i) => `<rect x="${4 + i * bw + 0.5}" y="${H - P - (H - P - 6) * c / max}" width="${Math.max(1, bw - 1)}" height="${(H - P - 6) * c / max}" fill="#7fb38a"/>`).join("");
  const step = h.step, ticks = [];
  const every = Math.ceil(n / 6);
  for (let i = 0; i <= n; i += every) ticks.push(`<text x="${4 + i * bw}" y="${H - 4}" font-size="10" fill="#5d6b61" text-anchor="middle">${fmt(i * step, 2)}</text>`);
  const mx = med != null ? 4 + med / step * bw : null;
  return `<svg viewBox="0 0 ${W} ${H}" role="img">${bars}
    <line x1="4" x2="${W - 4}" y1="${H - P}" y2="${H - P}" stroke="#c9d1cb"/>${ticks.join("")}
    ${mx != null ? `<line x1="${mx}" x2="${mx}" y1="4" y2="${H - P}" stroke="#1b6b2c" stroke-width="1.5" stroke-dasharray="3 2"/>` : ""}</svg>`;
}
// passo «tondo» (1, 2, 5 × 10^k) per avere circa n tacche fino a max
const niceStep = (max, n = 5) => { const raw = max / n, p = 10 ** Math.floor(Math.log10(raw)); return [1, 2, 5, 10].map(m => m * p).find(s => s >= raw); };
// nuvola di punti dei rapporti (build_species.py, scatter): circonferenza in x, altezza o chioma in y; ogni punto è
// una cella della griglia, più scuro se ha più alberi. La retta tratteggiata passa per l'origine con pendenza uguale
// alla mediana del rapporto: sopra ci sono gli alberi con il rapporto più alto della mediana, sotto quelli più basso.
function scatterSvg(sc, med, yLabel) {
  const W = 480, H = 300, L = 46, R = 12, Tp = 8, B = 40, pw = W - L - R, ph = H - Tp - B;
  const xmax = sc.nx * sc.sx, ymax = sc.ny * sc.sy, cw = pw / sc.nx, ch = ph / sc.ny;
  const X = v => L + v / xmax * pw, Y = v => Tp + ph - v / ymax * ph;
  let max = 1;
  for (let k = 2; k < sc.pts.length; k += 3) max = Math.max(max, sc.pts[k]);
  const lm = Math.log(1 + max), dots = [];
  for (let k = 0; k < sc.pts.length; k += 3) {
    const [i, j, c] = [sc.pts[k], sc.pts[k + 1], sc.pts[k + 2]];
    const op = (0.2 + 0.8 * Math.log(1 + c) / lm).toFixed(2);
    dots.push(`<circle cx="${(L + (i + 0.5) * cw).toFixed(1)}" cy="${(Tp + ph - (j + 0.5) * ch).toFixed(1)}" r="2" fill-opacity="${op}"/>`);
  }
  const ax = [], gx = niceStep(xmax), gy = niceStep(ymax, 4);
  for (let v = 0; v <= xmax + 1e-9; v += gx) ax.push(`<line x1="${X(v)}" x2="${X(v)}" y1="${Tp}" y2="${Tp + ph}" stroke="#eef1ee"/><text x="${X(v)}" y="${Tp + ph + 16}" text-anchor="middle">${fmt(v, 2)}</text>`);
  for (let v = 0; v <= ymax + 1e-9; v += gy) ax.push(`<line x1="${L}" x2="${L + pw}" y1="${Y(v)}" y2="${Y(v)}" stroke="#eef1ee"/><text x="${L - 5}" y="${Y(v) + 4.5}" text-anchor="end">${fmt(v, 2)}</text>`);
  // retta della mediana fino al bordo del grafico (a destra o in alto)
  const xe = Math.min(xmax, ymax / med), ye = xe * med;
  return `<svg viewBox="0 0 ${W} ${H}" role="img" font-size="13" fill="#5d6b61">${ax.join("")}
    <g fill="#2f7d40">${dots.join("")}</g>
    <line x1="${X(0)}" y1="${Y(0)}" x2="${X(xe)}" y2="${Y(ye)}" stroke="#1b6b2c" stroke-width="1.5" stroke-dasharray="4 3"/>
    <line x1="${L}" x2="${L + pw}" y1="${Tp + ph}" y2="${Tp + ph}" stroke="#c9d1cb"/><line x1="${L}" x2="${L}" y1="${Tp}" y2="${Tp + ph}" stroke="#c9d1cb"/>
    <text x="${L + pw / 2}" y="${H - 3}" text-anchor="middle">${T.axC}</text>
    <text transform="translate(13 ${Tp + ph / 2}) rotate(-90)" text-anchor="middle">${yLabel}</text></svg>`;
}
function sizes() {
  const S = D.stats;
  const box = (title, s, unit) => `<div class="card stat"><h3 style="margin:0;font-size:14px">${title}</h3>${s.med == null
    ? `<div class="none">${T.few}</div>` : `<div><span class="big">${fmt(s.med, 2)} ${unit}</span> <span class="n">${T.median}, ${T.on(fmt(s.n))}</span></div>
    ${s.hist ? histSvg(s.hist, s.med, unit) : ""}`}</div>`;
  // spiegazione del grafico in un (?) in alto a destra: si apre passandoci sopra o toccandolo (focus)
  const tip = sc => `<span class="tip" tabindex="0" role="button" aria-label="${esc(T.scHelp)}">?<span class="tipbox" role="tooltip">${T.scInfo}${sc.over ? " " + T.scOver(fmt(sc.over)) : ""}</span></span>`;
  const ratio = (title, s, info, wiki, yLabel) => `<div class="card stat">${s.med != null && s.sc ? tip(s.sc) : ""}<h3 style="margin:0;font-size:14px">${title}</h3>${s.med == null
    ? `<div class="none">${T.few}</div>` : `<div><span class="big">${fmt(s.med, 2)}</span> <span class="n">${T.median}, ${T.on(fmt(s.n))}${wiki ? " · " + T.wikiAvg(fmt(wiki, 2)) : ""}</span></div>`}
    <div class="n" style="margin-top:4px">${info}</div>
    ${s.med != null && s.sc ? scatterSvg(s.sc, s.med, yLabel) : ""}</div>`;
  return `<section><h2>${T.sizeTitle}</h2><p class="lead">${T.sizeLead}</p>
    <div class="grid3">${box(T.height, S.height, "m")}${box(T.trunkM, S.trunk, "m")}${box(T.crownM, S.crown, "m")}</div>
    <div class="ratios">${ratio(T.hc, S.h_c, T.hcInfo, D.wiki.height_circ_ratio, T.axH)}${ratio(T.crc, S.cr_c, T.crcInfo, D.wiki.crown_circ_ratio, T.axCr)}</div></section>`;
}

const PALETTE = ["#d9f0d3", "#a6dba0", "#5aae61", "#1b7837", "#00441b"];
const ABSENT = "#e4e4e4";
let mapMode = "share", mapGroup = "reg", map = null, BOUNDS = null;
let heatOn = false, monOn = false;              // densità e monumentali: spenti all'apertura
const vis = on => on ? "visible" : "none";
// monumentali della specie ([lon, lat, id, nome]): un file a parte (<slug>.mon.json), scaricato la prima volta che
// si accende la casella; resta in memoria se la pagina viene ridisegnata (cambio di lingua)
let MON = null;
const monData = () => ({ type: "FeatureCollection", features: (MON || []).map(([x, y, id, name]) => ({ type: "Feature", properties: { id, name }, geometry: { type: "Point", coordinates: [x, y] } })) });

  if (MON) return;
  try { MON = await fetch(D.slug + ".mon.json").then(r => r.json()); } catch (e) { return; }
  if (map && map.getSource("mon")) map.getSource("mon").setData(monData());
}
const valueOf = (s, mode) => !s || !s.sp ? null : mode === "share" ? 100 * s.n / s.sp : mode === "count" ? s.n : s.km2 ? s.n / s.km2 : null;
function breaks(vals) {
  const v = vals.filter(x => x > 0).sort((a, b) => a - b);
  if (!v.length) return [];
  const q = [0.2, 0.4, 0.6, 0.8].map(p => v[Math.min(v.length - 1, Math.floor(p * v.length))]);
  return [...new Set(q)];
}
const classOf = (x, br) => { let i = 0; while (i < br.length && x > br[i]) i++; return i; };
function mapSection() {
  const seg = (id, items, cur) => `<span class="seg" id="${id}">${items.map(([k, l]) => `<button type="button" data-k="${k}" aria-pressed="${k === cur}">${l}</button>`).join("")}</span>`;
  const rows = Object.entries(D.regions).filter(([, s]) => s.n > 0);
  // per la quota solo le regioni con almeno 500 alberi con una specie qualunque (sp), senza nota nella pagina
  const byShare = rows.filter(([, s]) => s.sp >= 500).sort((a, b) => b[1].n / b[1].sp - a[1].n / a[1].sp).slice(0, 10);
  const byCount = rows.sort((a, b) => b[1].n - a[1].n).slice(0, 10);
  const table = list => `<table><thead><tr><th>${T.region}</th><th class="num">${T.treesCol}</th><th class="num">${T.shareCol}</th><th class="num">${T.densCol}</th></tr></thead><tbody>${list.map(([k, s]) =>
    `<tr><td>${esc(regName(k))}</td><td class="num">${fmt(s.n)}</td><td class="num">${fmt(100 * s.n / s.sp, 1)}%</td><td class="num">${s.km2 ? sig(s.n / s.km2) : "–"}</td></tr>`).join("")}</tbody></table>`;
  return `<section><h2>${T.mapTitle}</h2><p class="lead">${T.mapLead}</p>
    <div class="controls">${seg("mode", [["share", T.mShare], ["count", T.mCount], ["dens", T.mDens]], mapMode)}
      ${seg("group", [["reg", T.gReg], ["nat", T.gNat]], mapGroup)}
      <label><input type="checkbox" id="heat"${heatOn ? " checked" : ""}> ${T.heat}</label>
      <label><input type="checkbox" id="monck"${monOn ? " checked" : ""}> <span style="color:#9a6a00">●</span> ${T.monL} (${fmt(D.mon_n)})</label></div>
    <div id="map"></div><div class="legend" id="legend"></div>
    <div class="tables"><div><h3>${T.topShare}</h3>${table(byShare)}</div>
      <div><h3>${T.topCount}</h3>${table(byCount)}</div></div></section>`;
}
function choropleth() {
  if (!map || !BOUNDS || !map.getLayer("reg-fill")) return;
  const stats = mapGroup === "reg" ? D.regions : D.nations;
  // in «Nazioni» i contorni "g:<nazione>" e le regioni che sono già una nazione; in «Regioni» tutte le altre
  const keys = BOUNDS.features.map(f => f.properties.key).filter(k => mapGroup === "nat" ? k in D.nations : !k.startsWith("g:"));
  const vals = keys.map(k => valueOf(stats[k], mapMode));
  const br = breaks(vals);
  const expr = ["match", ["get", "key"]];
  keys.forEach((k, i) => { const v = vals[i]; if (v == null) return; expr.push(k, v > 0 ? PALETTE[classOf(v, br)] : ABSENT); });
  expr.push("rgba(0,0,0,0)");
  map.setPaintProperty("reg-fill", "fill-color", expr);
  const shown = ["in", ["get", "key"], ["literal", keys]];
  map.setFilter("reg-fill", shown); map.setFilter("reg-line", shown);
  const info = { share: T.shareInfo, count: T.countInfo, dens: T.densInfo }[mapMode];
  const edges = [0, ...br];
  const f = v => mapMode === "count" ? fmt(v) : sig(v);
  const lab = i => i < br.length ? `${i ? "> " + f(edges[i]) + " – " : "≤ "}${f(br[i])}` : `> ${f(br[br.length - 1] ?? 0)}`;
  document.getElementById("legend").innerHTML = `<span>${info}:</span>` +
    PALETTE.slice(0, br.length + 1).map((c, i) => `<span><i style="background:${c}"></i>${lab(i)}${mapMode === "share" ? "%" : ""}</span>`).join("") +
    `<span><i style="background:${ABSENT}"></i>${T.absent}</span>`;
}
function initMap() {
  // vista iniziale: il mondo intero (senza l'Antartide)
  map = new maplibregl.Map({ container: "map", style: "https://tiles.openfreemap.org/styles/positron",
    bounds: [[-168, -50], [178, 72]], fitBoundsOptions: { padding: 10 },
    attributionControl: { compact: true }, cooperativeGestures: true });
  map.addControl(new maplibregl.NavigationControl({ showCompass: false }));
  const grid = { type: "FeatureCollection", features: D.grid.map(([x, y, c]) => ({ type: "Feature", properties: { c }, geometry: { type: "Point", coordinates: [x, y] } })) };
  map.on("load", async () => {
    const first = map.getStyle().layers.find(l => l.type === "symbol")?.id;
    BOUNDS = await fetch("../data/regions_boundaries.geojson").then(r => r.json());
    map.addSource("reg", { type: "geojson", data: BOUNDS });
    map.addLayer({ id: "reg-fill", type: "fill", source: "reg", paint: { "fill-color": "rgba(0,0,0,0)", "fill-opacity": 0.75 } }, first);
    map.addLayer({ id: "reg-line", type: "line", source: "reg", paint: { "line-color": "#fff", "line-width": 0.6 } }, first);
    map.addSource("grid", { type: "geojson", data: grid });
    const maxc = Math.max(1, ...D.grid.map(g => g[2]));
    map.addLayer({ id: "heat", type: "heatmap", source: "grid", maxzoom: 10, layout: { visibility: vis(heatOn) }, paint: {
      "heatmap-weight": ["/", ["ln", ["+", 1, ["get", "c"]]], Math.log(1 + maxc)],
      "heatmap-intensity": ["interpolate", ["linear"], ["zoom"], 2, 0.8, 9, 2],
      "heatmap-radius": ["interpolate", ["linear"], ["zoom"], 2, 6, 6, 14, 9, 28],
      "heatmap-opacity": ["interpolate", ["linear"], ["zoom"], 8, 0.85, 10, 0],
      "heatmap-color": ["interpolate", ["linear"], ["heatmap-density"], 0, "rgba(0,0,0,0)", 0.15, "rgba(255,237,160,.6)", 0.4, "#feb24c", 0.7, "#f03b20", 1, "#8b0000"] } });
    map.addLayer({ id: "cells", type: "circle", source: "grid", minzoom: 8, layout: { visibility: vis(heatOn) }, paint: {
      "circle-radius": ["interpolate", ["linear"], ["zoom"], 8, ["+", 2, ["*", 1.2, ["ln", ["+", 1, ["get", "c"]]]]], 12, ["+", 4, ["*", 3, ["ln", ["+", 1, ["get", "c"]]]]]],
      "circle-color": "#f03b20", "circle-opacity": ["interpolate", ["linear"], ["zoom"], 8, 0, 10, 0.6], "circle-stroke-width": 0 } });
    map.addSource("mon", { type: "geojson", data: monData() });
    map.addLayer({ id: "mon", type: "circle", source: "mon", layout: { visibility: vis(monOn) }, paint: {
      "circle-radius": ["interpolate", ["linear"], ["zoom"], 2, 2.2, 8, 4, 14, 7], "circle-color": "#ffd34d",
      "circle-stroke-color": "#9a6a00", "circle-stroke-width": 1 } });
    map.on("click", "mon", e => {
      const p = e.features[0].properties;
      new maplibregl.Popup().setLngLat(e.lngLat).setHTML(`<a href="../monumental-trees/index.html#node=${p.id}">${esc(p.name || T.node(p.id))}</a>`).addTo(map);
    });
    map.on("click", "reg-fill", e => {
      if (map.queryRenderedFeatures(e.point, { layers: ["mon"] }).length) return;
      const k = e.features[0].properties.key, s = (mapGroup === "reg" ? D.regions : D.nations)[k];
      if (!s) return;
      const nm = LANG === "it" ? s.name : s.name_en;
      new maplibregl.Popup().setLngLat(e.lngLat).setHTML(`<b>${esc(nm)}</b><br>${T.treesCol}: ${fmt(s.n)}<br>${T.shareCol}: ${sig(100 * s.n / Math.max(1, s.sp))}%<br>${T.densCol}: ${s.km2 ? sig(s.n / s.km2) : "–"}`).addTo(map);
    });
    for (const l of ["mon", "reg-fill"]) { map.on("mouseenter", l, () => map.getCanvas().style.cursor = "pointer"); map.on("mouseleave", l, () => map.getCanvas().style.cursor = ""); }
    choropleth();
  });
}
function bindMap() {
  const seg = (id, set) => document.getElementById(id).addEventListener("click", e => {
    const b = e.target.closest("button"); if (!b) return;
    set(b.dataset.k);
    for (const x of e.currentTarget.children) x.setAttribute("aria-pressed", x === b);
    choropleth();
  });
  seg("mode", k => mapMode = k);
  seg("group", k => mapGroup = k);
  document.getElementById("heat").addEventListener("change", e => { heatOn = e.target.checked; for (const l of ["heat", "cells"]) map.setLayoutProperty(l, "visibility", vis(heatOn)); });
  document.getElementById("monck").addEventListener("change", e => { monOn = e.target.checked; if (monOn) loadMon(); map.setLayoutProperty("mon", "visibility", vis(monOn)); });
}

// ---------- aspetto sulla mappa (stessi colori e sagome di index.html) ----------
const hash01 = (id, k) => { let x = (id * 2654435761 + k * 40503) >>> 0; x ^= x >>> 15; x = Math.imul(x, 2246822507) >>> 0;
  x ^= x >>> 13; return (x >>> 0) / 4294967296; };
// sagoma della chioma vista dall'alto (crownOutline in index.html)
function crownOutline(kind, id, r) {
  const pts = [];
  if (kind === "spiky") {
    const n = 14, kin = 0.74, rot = (id % 11) / 11 * (2 * Math.PI / n);
    const R = r * Math.sqrt(Math.PI / (n * kin * Math.sin(Math.PI / n)));
    for (let k = 0; k < 2 * n; k++) { const a = rot + k * Math.PI / n, Rk = k % 2 ? R * kin : R; pts.push([Rk * Math.cos(a), Rk * Math.sin(a)]); }
  } else if (kind === "palm") {
    const n = 8 + (id % 3), M = 8, rot = hash01(id, 4) * 2 * Math.PI, kin = 0.3, rr = [];
    for (let f = 0; f < n; f++) { const len = 1 + (hash01(id, 20 + f) - 0.5) * 0.16;
      for (let j = 0; j < M; j++) { const d = Math.abs(2 * j / M - 1); rr.push(kin + (len - kin) * Math.pow(1 - d, 0.6)); } }
    const da = 2 * Math.PI / rr.length; let area = 0; rr.forEach((v, k) => area += 0.5 * v * rr[(k + 1) % rr.length] * Math.sin(da));
    const sc = r * Math.sqrt(Math.PI / area); rr.forEach((v, k) => pts.push([sc * v * Math.cos(rot + k * da), sc * v * Math.sin(rot + k * da)]));
  } else {
    const lobes = 6 + (id % 3), ph = (id % 97) * 0.37, N = 56;
    for (let k = 0; k < N; k++) { const a = k / N * 2 * Math.PI, R = r * 1.06 * (0.84 + 0.16 * Math.abs(Math.sin(lobes / 2 * a + ph))); pts.push([R * Math.cos(a), R * Math.sin(a)]); }
  }
  return pts;
}
const CYCLE_COLOR = lc => /^(semi_)?deciduous$/.test(lc) ? "#a5d64c" : /^(semi_)?evergreen$/.test(lc) ? "#1f6b35" : "#5fa36f";
const AUTUMN_TONES = ["#e3b524", "#dd8a1f", "#b5502a", "#9a6b3a"];
// spots: [colore, colore] delle macchiette (SPECIES_SPOTS di index.html), sparse sulla chioma, 70% nel primo colore
function treeSvg({ fill, opacity = 0.55, stroke = "#1b6b2c", sw = 1.2, fruits = null, id = 1234567, trunk = true, spots = null }, cx = 100, cy = 100, r = 70) {
  const kind = D.lt === "needleleaved" ? "spiky" : D.lt === "palm" ? "palm" : "blob";
  const pts = crownOutline(kind, id, r).map(([x, y]) => `${(cx + x).toFixed(1)},${(cy - y).toFixed(1)}`).join(" ");
  let s = `<polygon points="${pts}" fill="${fill}" fill-opacity="${opacity}" stroke="${stroke}" stroke-width="${sw}"/>`;
  if (spots) {                                    // mulberry32 con seme fisso: le stesse macchiette a ogni apertura
    let q = 12345;
    const rnd = () => { q = (q + 0x6D2B79F5) >>> 0; let t = Math.imul(q ^ (q >>> 15), 1 | q);
      t ^= t + Math.imul(t ^ (t >>> 7), 61 | t); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
    for (let k = 0; k < 90; k++) {
      const a = rnd() * 2 * Math.PI, d = r * 0.9 * Math.sqrt(rnd()), c = rnd() < 0.7 ? spots[0] : spots[1];
      s += `<circle cx="${(cx + d * Math.cos(a)).toFixed(1)}" cy="${(cy - d * Math.sin(a)).toFixed(1)}" r="${(r * 0.035).toFixed(2)}" fill="${c}" fill-opacity="0.9"/>`;
    }
  }
  if (trunk) s += `<circle cx="${cx}" cy="${cy}" r="${r * 0.11}" fill="${D.bark || "#7b4a1e"}"${D.bark ? ' stroke="#8a8a8a" stroke-width="0.8"' : ""}/>`;
  if (fruits) {                                   // 7 frutti come su una chioma grande (decoPoints in index.html)
    const nf = 7, rot = hash01(id, 2) * 2 * Math.PI;
    for (let k = 0; k < nf; k++) {
      const a = rot + k * 2 * Math.PI / nf + (hash01(id, k + 3) - 0.5) * (Math.PI / nf), d = r * (0.45 + 0.35 * hash01(id, k + 50));
      s += `<circle cx="${(cx + d * Math.cos(a)).toFixed(1)}" cy="${(cy - d * Math.sin(a)).toFixed(1)}" r="${r * 0.09}" fill="${fruits}" stroke="#0005" stroke-width="0.6"/>`;
    }
  }
  return s;
}
const monthRange = (a, b) => `${T.months[a - 1]} – ${T.months[b - 1]}`;
const monthList = ms => { // mesi consecutivi uniti: [7,8,9] -> lug – set
  if (!ms.length) return T.always;
  const s = [...ms].sort((a, b) => a - b), out = []; let st = s[0], pr = s[0];
  for (const m of [...s.slice(1), null]) { if (m === pr + 1) { pr = m; continue; } out.push(st === pr ? T.months[st - 1] : monthRange(st, pr)); st = pr = m; }
  return out.join(", ");
};
// Ogni disegno è «della specie» (colore proprio in SPECIES_COLORS di index.html, frutti) o «generico» (lo stesso per
// tutte le specie con quel tipo di foglia e quel ciclo): sui generici un (?) accanto al badge invita a proporne uno dedicato.
// Lo spoglio è uguale per tutti gli alberi caducifogli e non ha badge
const ISSUE = "https://github.com/ivanbranco/tree-osm-qa/issues/new?template=species-rendering.yml";
function looks() {
  const dec = /^(semi_)?deciduous$/.test(D.lc || ""), broad = D.lt === "broadleaved", sm = D.sample;
  const sc = D.spColor, scAut = sc && sc[2], scLeaf = sc && !sc[2];
  const link = season => sm ? `<p><a href="../index.html#region=${sm.r}&node=${sm.id}${season ? "&season=" + season : ""}">${T.see}</a></p>` : "";
  // own === null: disegno uguale per tutte le specie (spoglio), senza badge né (?)
  const badge = own => own === null ? "" : `<span class="kind ${own ? "own" : "gen"}">${own ? T.own : T.generic}</span>${own ? "" : `<button class="help" type="button" title="${T.genTitle}" aria-label="${T.genTitle}">?</button>`}`;
  const tile = (title, sub, body, season, own) => `<div class="look">
    <svg viewBox="0 0 200 200">${body}</svg><h3>${title}</h3>${badge(own)}<p>${sub}</p>${link(season)}</div>`;
  const base = CYCLE_COLOR(D.lc || "");
  const leafFill = scLeaf ? sc[0] : base;
  const leafSub = scLeaf && sc[1] ? monthList(sc[1]) : dec ? monthRange(4, 9) : T.evergreen;
  // chioma a macchiette (D.spots): colori propri con le foglie e in autunno, sul calendario di tutte le caducifoglie
  const sp2 = D.spots;
  const tiles = [sp2 ? tile(T.leaves, monthRange(4, 9), treeSvg({ fill: sp2.leaf[0], opacity: 0.7, spots: sp2.leaf.slice(1) }), "leaves", true)
    : tile(T.leaves, leafSub, treeSvg({ fill: leafFill, opacity: scLeaf ? 0.7 : 0.55 }), dec ? "leaves" : "", !!scLeaf)];
  if (sp2) {
    tiles.push(tile(T.autumn, monthRange(10, 11), treeSvg({ fill: sp2.autumn[0], opacity: 0.7, spots: sp2.autumn.slice(1) }), "autumn", true));
  } else if (scAut) {
    tiles.push(tile(T.autumn, monthList(sc[1]), treeSvg({ fill: sc[0], opacity: 0.7 }), "autumn", true));
  } else if (dec && broad) {
    const four = AUTUMN_TONES.map((c, i) => treeSvg({ fill: c, opacity: 0.7, id: 1234567 + i * 7919 }, 55 + (i % 2) * 90, 55 + Math.floor(i / 2) * 90, 40)).join("");
    tiles.push(tile(T.autumn, `${monthRange(10, 11)}. ${T.autumnInfo}`, four, "autumn", false));
  }
  if (dec) tiles.push(tile(T.bare, monthRange(12, 3), treeSvg({ fill: "#cdbb9f", opacity: 0.02, stroke: "#7d6650", sw: 1.6 }), "bare", null));
  if (D.fruit) tiles.push(tile(T.fruits, monthList(D.fruit.months), treeSvg({ fill: base, fruits: D.fruit.color }), "", true));
  const issue = `${ISSUE}&title=${encodeURIComponent("Rendering: " + D.name)}&species=${encodeURIComponent(D.name)}`;
  return `<section><h2>${T.lookTitle}</h2><p class="lead">${T.lookLead}</p><div class="looks">${tiles.join("")}</div>
    <dialog id="gen-dlg"><h3>${T.genTitle}</h3><p>${T.genText(D.lt, D.lc)}</p><p>${T.genAsk}</p>
      <div class="btns"><button type="button" value="close">${T.close}</button><a href="${issue}" target="_blank" rel="noopener">${T.propose}</a></div></dialog></section>`;
}
function bindLooks() {
  const dlg = document.getElementById("gen-dlg");
  document.querySelectorAll(".look .help").forEach(b => b.addEventListener("click", () => dlg.showModal()));
  dlg.querySelector("button").addEventListener("click", () => dlg.close());
  dlg.addEventListener("click", e => { if (e.target === dlg) dlg.close(); });   // clic fuori dal riquadro
}

// ---------- maschio e femmina (specie dioiche) ----------
// D.sex (build_species.py, sex_info): i tratti che distinguono i due sessi, gli stessi del riquadro ♂ / ♀ della scheda
// dell'albero (L.sexTraits in index.html), con la foto di Commons se c'è. Il maschio a sinistra, la femmina a destra
const SEX_SVG = {      // come in index.html
  male: '<circle cx="9" cy="15" r="6"/><path d="M13.5 10.5 21 3M15 3h6v6"/>',
  female: '<circle cx="12" cy="9" r="6"/><path d="M12 15v8M8 19.5h8"/>'
};
function sexes() {
  if (!D.sex) return "";
  const col = k => { const s = D.sex[k], n = D.sex.n[k], alt = (s.alt || {})[LANG] || D.name;
    const photo = s.img ? `<figure class="photo"><a href="https://commons.wikimedia.org/wiki/File:${encodeURIComponent(s.img)}" target="_blank" rel="noopener">
      <img src="https://commons.wikimedia.org/wiki/Special:FilePath/${encodeURIComponent(s.img)}?width=640" alt="${esc(alt)}" loading="lazy"></a>
      <figcaption data-file="${esc(s.img)}">Wikimedia Commons</figcaption></figure>` : "";
    return `<div class="card">${photo}<div class="body"><h3><svg viewBox="0 0 24 24" aria-hidden="true">${SEX_SVG[k]}</svg>${T.sexName[k]}</h3>
      <p>${esc(s[LANG])}</p><div class="n">${T.sexN(fmt(n), k)}</div></div></div>`; };
  return `<section id="sex"><h2>${T.sexTitle}</h2><p class="lead">${T.sexLead}</p><div class="sexes">${col("male")}${col("female")}</div></section>`;
}

// ---------- pagina ----------
function render() {
  T = I18N[LANG]; LOC = LANG === "it" ? "it-IT" : "en-GB";
  document.documentElement.lang = LANG;
  document.getElementById("lang").textContent = T.other;
  document.getElementById("crumb").textContent = T.crumb;
  if (FROM) { const b = document.querySelector("header.top .brand"); b.href = treeLink(FROM); b.title = T.back; }
  const view = map ? { c: map.getCenter(), z: map.getZoom() } : null;
  if (map) { map.remove(); map = null; BOUNDS = null; }
  document.getElementById("main").innerHTML = hero() + looks() + sexes() + records() + sizes() + mapSection();
  document.getElementById("foot").innerHTML = T.foot(new Date(D.updated).toLocaleDateString(LOC, { day: "numeric", month: "long", year: "numeric" }));
  initMap(); bindMap(); bindLooks(); bindEvents(); fillCredit();
  if (view) map.once("load", () => map.jumpTo({ center: view.c, zoom: view.z }));
}
document.getElementById("lang").addEventListener("click", () => {
  LANG = LANG === "it" ? "en" : "it";
  try { localStorage.setItem("lang", LANG); } catch (e) {}
  render();
});
render();
</script>
