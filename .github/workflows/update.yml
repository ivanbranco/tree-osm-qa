name: Aggiorna dati alberi

on:
  workflow_dispatch:
    inputs:
      region:
        description: "Regione da aggiornare (all = tutte; italia, polonia = tutte le regioni del paese)"
        type: choice
        default: all
        options:
          - all
          - italia
          - polonia
          - bulgaria
          - croazia
          - estonia
          - lettonia
          - lituania
          - slovenia
          - dolnoslaskie
          - kujawsko-pomorskie
          - lubelskie
          - lubuskie
          - lodzkie
          - malopolskie
          - mazowieckie
          - opolskie
          - podkarpackie
          - podlaskie
          - pomorskie
          - slaskie
          - swietokrzyskie
          - warminsko-mazurskie
          - wielkopolskie
          - zachodniopomorskie
          - piemonte
          - valle-d-aosta
          - lombardia
          - trentino-alto-adige
          - veneto
          - friuli-venezia-giulia
          - liguria
          - emilia-romagna
          - toscana
          - umbria
          - marche
          - lazio
          - abruzzo
          - molise
          - campania
          - puglia
          - basilicata
          - calabria
          - sicilia
          - sardegna
      regions:
        description: "Oppure più regioni, separate da spazi o virgole (es. liguria veneto lettonia): se compilato, la scelta sopra è ignorata"
        type: string
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: update-trees
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Scarica i dati
        env:   # passate come variabili d'ambiente, non inserite nel comando
          REGIONS: ${{ github.event.inputs.regions }}
          REGION: ${{ github.event.inputs.region || 'all' }}
        run: python scripts/fetch_trees.py "${REGIONS:-$REGION}"
      - name: Commit
        if: ${{ !cancelled() }}
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add data
          git diff --cached --quiet || (git commit -m "Aggiornamento dati alberi" && git pull --rebase && git push)
