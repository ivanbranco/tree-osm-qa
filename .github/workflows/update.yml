          - lettonia
          - liechtenstein
          - lituania
          - lussemburgo
          - macedonia-del-nord
          - malta
          - monaco
          - montenegro
          - portogallo
          - romania
          - san-marino
          - serbia
          - slovenia
          - terre-australi-francesi
          - vaticano
          - venezuela
          - alta-austria
