name: Aggiorna dati alberi

on:
  workflow_dispatch:
    inputs:
      region:
        description: "Regione da aggiornare (all = tutte; italia, polonia, regno-unito, francia, irlanda, austria = tutte le regioni del paese)"
        type: choice
        default: all
        options:
          - all
          - italia
          - polonia
          - regno-unito
          - francia
          - irlanda
          - austria
          - albania
          - bosnia-erzegovina
          - bulgaria
          - croazia
          - estonia
          - giappone
          - grecia
          - kosovo
          - lettonia
          - lituania
          - lussemburgo
          - macedonia-del-nord
          - montenegro
          - portogallo
          - romania
          - serbia
          - slovenia
          - washington
          - alta-austria
          - bassa-austria
          - burgenland
          - carinzia
          - salisburgo
          - stiria
          - tirolo
          - vienna
          - vorarlberg
          - connacht
          - leinster
          - munster
          - ulster-irlanda
          - est-inghilterra
          - galles
          - irlanda-del-nord
          - londra
          - midlands-occidentali
          - midlands-orientali
          - nord-est-inghilterra
          - nord-ovest-inghilterra
          - scozia
          - sud-est-inghilterra
          - sud-ovest-inghilterra
          - yorkshire-e-humber
          - alta-francia
          - alvernia-rodano-alpi
          - borgogna-franca-contea
          - bretagna
          - centro-valle-della-loira
          - corsica
          - grand-est
          - ile-de-france
          - normandia
          - nuova-aquitania
          - occitania
          - paesi-della-loira
          - provenza-alpi-costa-azzurra
          - dolnoslaskie
          - kujawsko-pomorskie
          - lubelskie
          - lubuskie
          - lodzkie
          - malopolskie
          - mazowieckie
          - opolskie
          - podkarpackie
          - podlaskie
          - pomorskie
          - slaskie
          - swietokrzyskie
          - warminsko-mazurskie
          - wielkopolskie
          - zachodniopomorskie
          - piemonte
          - valle-d-aosta
          - lombardia
          - trentino-alto-adige
          - veneto
          - friuli-venezia-giulia
          - liguria
          - emilia-romagna
          - toscana
          - umbria
          - marche
          - lazio
          - abruzzo
          - molise
          - campania
          - puglia
          - basilicata
          - calabria
          - sicilia
          - sardegna
      regions:
        description: "Oppure più regioni, separate da spazi o virgole (es. liguria veneto lettonia): se compilato, la scelta sopra è ignorata"
        type: string
        required: false
        default: ""
      fairwaymapper:
        description: "Usa FairwayMapper (se c'è il secret FAIRWAYMAPPER_KEY); togli la spunta per non consumare la quota"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: update-trees
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Scarica i dati
        env:   # passate come variabili d'ambiente, non inserite nel comando
          REGIONS: ${{ github.event.inputs.regions }}
          REGION: ${{ github.event.inputs.region || 'all' }}
          PYTHONUNBUFFERED: "1"   # i messaggi dello script compaiono subito nel log
          # facoltativa: senza (o senza la spunta "Usa FairwayMapper"), si usano solo i server pubblici
          FAIRWAYMAPPER_KEY: ${{ inputs.fairwaymapper && secrets.FAIRWAYMAPPER_KEY || '' }}
        run: python scripts/fetch_trees.py "${REGIONS:-$REGION}"
      - name: Commit
        if: ${{ !cancelled() }}
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add data
          git diff --cached --quiet || (git commit -m "Aggiornamento dati alberi" && git pull --rebase && git push)
