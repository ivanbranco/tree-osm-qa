          - nord-est-inghilterra
          - nord-ovest-inghilterra
          - scozia
          - sud-est-inghilterra
          - sud-ovest-inghilterra
          - yorkshire-e-humber
          - alta-francia
          - alvernia-rodano-alpi
          - borgogna-franca-contea
          - bretagna
          - centro-valle-della-loira
          - corsica
          - grand-est
          - ile-de-france
          - normandia
          - nuova-aquitania
          - occitania
          - paesi-della-loira
          - provenza-alpi-costa-azzurra
          - dolnoslaskie
          - kujawsko-pomorskie
          - lubelskie
          - lubuskie
          - lodzkie
          - malopolskie
          - mazowieckie
          - opolskie
          - podkarpackie
          - podlaskie
          - pomorskie
          - slaskie
          - swietokrzyskie
          - warminsko-mazurskie
          - wielkopolskie
          - zachodniopomorskie
          - andalusia
          - aragona
          - asturie
          - canarie
          - cantabria
          - castiglia-e-leon
          - castiglia-la-mancia
          - catalogna
          - ceuta
          - comunita-di-madrid
          - comunita-valenciana
          - estremadura
          - galizia
          - isole-baleari
          - la-rioja
          - melilla
          - murcia
          - navarra
          - paesi-baschi
          - arizona
          - pennsylvania
          - washington
          - piemonte
          - valle-d-aosta
          - lombardia
          - trentino-alto-adige
          - veneto
          - friuli-venezia-giulia
          - liguria
          - emilia-romagna
          - toscana
          - umbria
          - marche
          - lazio
          - abruzzo
          - molise
          - campania
          - puglia
          - basilicata
          - calabria
          - sicilia
          - sardegna
      regions:
        description: "Or several regions, separated by spaces or commas (e.g. liguria veneto lettonia): if filled in, the choice above is ignored"
        type: string
        required: false
        default: ""
      overpass:
        description: "Overpass server to use first (with the key in the secret of the same name; the public servers are always used after it)"
        type: choice
        default: fairwaymapper
        options:
          - fairwaymapper
          - overpass.ch
          - public servers only
      elevation:
        description: "Download from overpass.ch the elevations of the trees that have none (new or moved trees; every tree of a region updated with this option for the first time), OVERPASS_CH_KEY secret; untick to save the quota (the elevations already downloaded are kept)"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: update-trees
  cancel-in-progress: false

jobs:
  test:   # i casi di prova dei check: se falliscono, il job "update" non parte e non si pubblica niente
    uses: ./.github/workflows/test-checks.yml
  update:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Download the data
        env:   # passate come variabili d'ambiente, non inserite nel comando
          REGIONS: ${{ github.event.inputs.regions }}
          REGION: ${{ github.event.inputs.region || 'all' }}
          PYTHONUNBUFFERED: "1"   # i messaggi dello script compaiono subito nel log
          # server Overpass con chiave scelto nel menu "overpass"; senza chiave si usano solo i server pubblici
          FAIRWAYMAPPER_KEY: ${{ inputs.overpass == 'fairwaymapper' && secrets.FAIRWAYMAPPER_KEY || '' }}
          OVERPASS_CH_OVERPASS: ${{ inputs.overpass == 'overpass.ch' && '1' || '0' }}
          # la chiave di overpass.ch serve per Overpass (se scelto) e per le quote degli alberi (se c'è la spunta
          # "elevation": gli alberi senza quota di tutte le regioni dell'aggiornamento)
          OVERPASS_CH_KEY: ${{ (inputs.overpass == 'overpass.ch' || inputs.elevation) && secrets.OVERPASS_CH_KEY || '' }}
          ELEVATION: ${{ inputs.elevation && '1' || '0' }}
        run: python scripts/fetch_trees.py "${REGIONS:-$REGION}"
      - name: Commit
        if: ${{ !cancelled() }}
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add data
          git diff --cached --quiet || (git commit -m "Update tree data" && git pull --rebase && git push)
