name: Aggiorna dati alberi

on:
  workflow_dispatch:
    inputs:
      region:
        description: "Regione da aggiornare (all = tutte)"
        type: choice
        default: all
        options:
          - all
	  - bulgaria
          - piemonte
          - valle-d-aosta
          - lombardia
          - trentino-alto-adige
          - veneto
          - friuli-venezia-giulia
          - liguria
          - emilia-romagna
          - toscana
          - umbria
          - marche
          - lazio
          - abruzzo
          - molise
          - campania
          - puglia
          - basilicata
          - calabria
          - sicilia
          - sardegna

permissions:
  contents: write

concurrency:
  group: update-trees
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Scarica i dati
        run: python scripts/fetch_trees.py "${{ github.event.inputs.region || 'all' }}"
      - name: Commit
        if: ${{ !cancelled() }}
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add data
          git diff --cached --quiet || (git commit -m "Aggiornamento dati alberi" && git pull --rebase && git push)
