name: Update monumental map

on:
  workflow_dispatch:
    inputs:
      fairwaymapper:
        description: "Use FairwayMapper (if the FAIRWAYMAPPER_KEY secret exists); untick to save the quota"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: update-trees      # come "Update tree data": le due Action scrivono le stesse cache
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Download the data
        env:
          PYTHONUNBUFFERED: "1"
          FAIRWAYMAPPER_KEY: ${{ inputs.fairwaymapper && secrets.FAIRWAYMAPPER_KEY || '' }}
        run: python scripts/fetch_world.py
      - name: Commit
        if: ${{ !cancelled() }}
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add data
          git diff --cached --quiet || (git commit -m "Update monumental map" && git pull --rebase && git push)
