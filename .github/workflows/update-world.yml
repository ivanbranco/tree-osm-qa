name: Update monumental map

on:
  workflow_dispatch:
    inputs:
      overpass:
        description: "Overpass server to use first (with the key in the secret of the same name; the public servers are always used after it)"
        type: choice
        default: fairwaymapper
        options:
          - fairwaymapper
          - overpass.ch
          - public servers only

permissions:
  contents: write

concurrency:
  group: update-trees      # come "Update tree data": le due Action scrivono le stesse cache
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Download the data
        env:
          PYTHONUNBUFFERED: "1"
          FAIRWAYMAPPER_KEY: ${{ inputs.overpass == 'fairwaymapper' && secrets.FAIRWAYMAPPER_KEY || '' }}
          OVERPASS_CH_OVERPASS: ${{ inputs.overpass == 'overpass.ch' && '1' || '0' }}
          OVERPASS_CH_KEY: ${{ inputs.overpass == 'overpass.ch' && secrets.OVERPASS_CH_KEY || '' }}
        run: python scripts/fetch_world.py
      - name: Commit
        if: ${{ !cancelled() }}
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add data
          git diff --cached --quiet || (git commit -m "Update monumental map" && git pull --rebase && git push)
