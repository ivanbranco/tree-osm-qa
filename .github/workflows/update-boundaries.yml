name: Update region boundaries

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Download the boundaries from Nominatim
        run: python scripts/update_boundaries.py
      - name: Commit
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add data/regions_boundaries.geojson
          git diff --cached --quiet || (git commit -m "Update region boundaries" && git pull --rebase && git push)
