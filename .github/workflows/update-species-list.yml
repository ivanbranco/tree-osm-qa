name: Aggiorna lista specie

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Scarica la lista dalla wiki OSM
        run: python scripts/update_species_list.py
      - name: Commit
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add scripts/species_list.json
          git diff --cached --quiet || (git commit -m "Aggiornamento lista specie" && git pull --rebase && git push)
