name: Update reference lists

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Download the lists from the OSM wiki and Taginfo
        run: python scripts/update_reference_lists.py
      - name: Commit
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add scripts/species_list.json scripts/genus_list.json scripts/denotation_values.json
          git diff --cached --quiet || (git commit -m "Update reference lists" && git pull --rebase && git push)
